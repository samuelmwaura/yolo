- hosts: all
  become: true
  vars:
    mongodb_volume: yolo_app_data
    backend_db_network: backend_db_network
    backend_frontend_network: backend_frontend_network
    db_container_name: yolo_mongodb
    backend_container_name: yolo_backend
    client_container_name: yolo_frontend
    mongodb_image: mongo
    backend_image: sammwaura/yolo_backend:v1.0.4
    client_image: sammwaura/yolo_frontend:v1.0.4
    app_repo: "https://github.com/samuelmwaura/yolo.git"
    repository_destination: "/home/vagrant/yolo_application"


  tasks:  
  # Install and configure Docker
  # configuring the repository bfore installing docker engine
    - name: Test Network connectivity
      ping:
    - name: Update apt package manager
      apt:
        update_cache: yes

    - name: Install Docker dependencies from apt
      apt:
        name: 
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
          - lsb-release
          - git
        state: present

    - name: Add Docker GPG key using apt Keys
      shell: |
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository to APT sources
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
        https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
        > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

#Now intalling docker engine
    - name: Install Docker Engine
      apt:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Add Vagrant user to docker group
      user:
        name: vagrant
        groups: docker
        append: yes

    - name: Ensure Docker service is running
      Service:
        name: docker
        state: started
        enabled: yes

    - name: Cloning the application repository into YoloBox
      git:
        repo: "{{ app_repo }}"
        dest: "{{ repository_destination }}"
        version: "main"
        force: yes

# Creating Docker networks and volumes

    - name: Create the backend_db_network
      shell: docker network create {{ backend_db_network }}

    - name: Create the backend_frontend_network
      shell: docker network create {{ backend_frontend_network }}

    - name: Create the database mongodb_volume
      shell: docker volume create {{ mongodb_volume }}

#Remove any exisiting containers if they exist

    - name: Remove existing mongodb container if any
      shell: docker rm -f {{ db_container_name }}
      ignore_errors: yes

    - name: Remove existing backend container if any
      shell: docker rm -f {{ backend_container_name }}
      ignore_errors: yes

    - name: Remove existing frontend container if any
      shell: docker rm -f {{ client_container_name }}
      ignore_errors: yes

# Run the yolo database container

    - name: Run the mongodb container
      shell: >
        docker run -d --name {{ db_container_name }}
        -p 27017:27017
        -v {{ mongodb_volume }}:/data/db
        --network {{ backend_db_network }}
        {{ mongodb_image }}

# Build the backend and Frontend image from the backend.dockerfile

    - name: Build the backend docker image
      shell: >
        docker build -t {{ backend_image }}
        -f {{ repository_destination }}/backend/backend.dockerfile
        {{ repository_destination }}/backend

    - name: Build the frontend docker image
      shell: >
        docker build -t {{ client_image }}
        -f {{ repository_destination }}/client/frontend.dockerfile
        {{ repository_destination }}/client 

# Run the backend and the frontend containers

    - name: Run the backend container
      shell: >
        docker run -d --name {{ backend_container_name }}
        -p 5001:5000
        --network {{ backend_db_network }}
        --network {{ backend_frontend_network }}
        --link {{ db_container_name }}:mongodb
        {{ backend_image }}

    - name: Run the frontend container
      shell: >
        docker run -d --name {{ client_container_name }}
        -p 3000:80
        --network {{ backend_frontend_network }}
        --link {{ backend_container_name }}:backend
        {{ client_image }}

        


     

appVersion: v1
kind: Deployment
metadata:
  name: yolo-app-mongodb
  labels:
    app: yolo-app-mongodb  #Identifier when relating this deployment to other objects
  namespace: yolo-app-kubernetes
spec:
  replicas: 1 #1 instance of the pod will be created
  selector:
    matchLabels:
      app: yolo-app-mongodb
    template: #Template for the pods that are being managed
      metadata:
        labels: 
          app: yolo-app-mongodb
      spec:
        containers:  #definition of the containers that will run inside the pod
          - name: yolo-app-mongodb
            image: mongo
            ports:
              - containerPort: 27017 #Port inside the container where the traffic is being directed
            volumeMounts:
              - name: mongodb-pvc
                mountPath: /data/db  #Mounting the volume to persist data
        volumes:
          - name: yolo-mongodb
            persistentVolumeClaim:
              claimName: mongodb-pvc  #Reference to the PVC for data persistence